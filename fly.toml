app = "mcp-hospital-cambiar-este-nombre"
primary_region = "mia"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  APP_DEBUG = "false"
  APP_TIMEZONE = "America/Caracas"

[http_service]
  internal_port = 80
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "off"
  min_machines_running = 1
  max_machines_running = 1

[[mounts]]
  source = "mcp_data"
  destination = "/data"
  initial_size = "2gb"

[vm]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
